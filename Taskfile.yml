# https://taskfile.dev

version: "3"

dotenv:
  - ".env"

vars:
  POSTGRES_HOST: "172.18.0.6"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "Lucas127."
  POSTGRES_DB_DEV: "nfxstorages_dev"
  POSTGRES_DB_PROD: "nfxstorages"
  POSTGRES_DB_SHADOW: "nfxstorages_diff"
  ATLAS_CONFIG_PATH: "file://databases/atlas.hcl"

tasks:
  atlas:status:
    desc: "Show Atlas migrate status (dev)"
    cmds:
      - |
        POSTGRES_USER="{{.POSTGRES_USER}}" \
        POSTGRES_PASSWORD="{{.POSTGRES_PASSWORD}}" \
        POSTGRES_HOST="{{.POSTGRES_HOST}}" \
        POSTGRES_PORT="{{.POSTGRES_PORT}}" \
        POSTGRES_DB_DEV="{{.POSTGRES_DB_DEV}}" \
        POSTGRES_DB_PROD="{{.POSTGRES_DB_PROD}}" \
        POSTGRES_DB_SHADOW="{{.POSTGRES_DB_SHADOW}}" \
        atlas migrate status --env dev --config {{.ATLAS_CONFIG_PATH}} --dir file://databases/migrations/development
