# https://taskfile.dev
# 推荐用法：`task start` → 先选择 dev / secure → 再从菜单选指令。
#   task start
#   task run（默认 dev） | task atlas:pipeline:run ENV=secure -- --no-skip
# HTTP 入口只有 NFX-Edge；infra 在 NFX-Stack / NFX-Edge。

version: "3"

vars:
  PROTO_SRC_DIR: protos
  PROTO_OUT_DIR: protos/gen
  GO_VERSION: "1.26.0"
  MODULE: "nfxstorages"
  ERRORS_DIR: errors
  MESSAGES_DIR: messages
  ENV: '{{.ENV | default "dev"}}'
  ENV_FILE: '{{if eq .ENV "secure"}}.secure.env{{else}}.env{{end}}'
  APP_COMPOSE: '{{if eq .ENV "secure"}}docker-compose.yml{{else}}docker-compose.dev.yml{{end}}'
  EDGE_NETWORK: nfx-edge

tasks:
  start:
    desc: "Interactive task menu — browse Taskfile tasks with ↑/↓ or w/s, Enter to run"
    cmds:
      - ./task.sh
    interactive: true

  install:
    desc: "Install required Go dev tools"
    cmds:
      - |
        if [ -f /volume1/Environments/use-menv.sh ]; then . /volume1/Environments/use-menv.sh >/dev/null 2>&1 || true; fi
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        go install github.com/air-verse/air@latest
        go install golang.org/x/tools/cmd/goimports@latest
        go install github.com/segmentio/golines@latest
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
    silent: false

  proto:gen:
    desc: "Generate gRPC & Protobuf code using buf"
    dir: "{{.PROTO_SRC_DIR}}"
    cmds:
      - buf dep update
      - buf generate
    sources:
      - "{{.PROTO_SRC_DIR}}/src/**/*.proto"
    generates:
      - "{{.PROTO_OUT_DIR}}/**/*.pb.go"

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run --timeout=5m

  fmt:
    desc: "Format Go code (goimports + golines)"
    cmds:
      - goimports -w .
      - golines -m 160 -w .
    silent: true

  ci:
    desc: "Run all CI tasks (format, lint)"
    cmds:
      - task: fmt
      - task: lint

  errors:add-templates:
    desc: "Add i18n comment blocks to .go files in errors/src that lack them"
    cmds:
      - go run ./errors/cmd/add_templates/ {{.ERRORS_DIR}}

  errors:gen-langs:
    desc: "Generate errors/langs/*.json from translation blocks in errors/src"
    cmds:
      - go run ./errors/cmd/gen_langs/ {{.ERRORS_DIR}} {{.CLI_ARGS}}

  errors:gen-langs:prod:
    desc: "Generate errors/langs/*.json for production (*p* overrides)"
    cmds:
      - go run ./errors/cmd/gen_langs/ {{.ERRORS_DIR}} --prod

  errors:
    desc: "Errors: add missing i18n blocks then generate langs"
    cmds:
      - task: errors:add-templates
      - task: errors:gen-langs

  messages:gen-langs:
    desc: "Generate messages/langs/*.json from translation blocks in messages/src"
    cmds:
      - go run ./messages/cmd/gen_langs/ {{.MESSAGES_DIR}} {{.CLI_ARGS}}

  messages:
    desc: "Generate Storages notify i18n JSON"
    cmds:
      - task: messages:gen-langs

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -rf bin/

  run:
    desc: "Generate langs then start s3/admin/object/iam/notify/system + console (ENV=dev|secure). Requires NFX-Edge network {{.EDGE_NETWORK}}."
    cmds:
      - go run ./errors/cmd/gen_langs/ {{.ERRORS_DIR}} {{if eq .ENV "secure"}}--prod{{end}}
      - go run ./messages/cmd/gen_langs/ {{.MESSAGES_DIR}}
      - |
        echo "==> ensure docker network {{.EDGE_NETWORK}}"
        if sudo docker network inspect {{.EDGE_NETWORK}}; then
          echo "  network {{.EDGE_NETWORK}} already exists"
        else
          echo "ERROR: Docker network {{.EDGE_NETWORK}} missing. Start NFX-Edge first."
          exit 1
        fi
      - |
        ENV_ARGS=(--env-file "{{.ENV_FILE}}")
        echo "==> compose env: {{.ENV_FILE}}"
        svcs=(s3-base admin-base object-base iam-base notify-base system-base console)
        for svc in "${svcs[@]}"; do
          echo "==> docker compose build $svc"
          sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} build "$svc"
        done
        echo "==> docker compose up"
        sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} up {{if eq .ENV "secure"}}-d{{end}}

  run:rebuild:
    desc: "Force-rebuild (--no-cache) s3/admin/object/iam/notify/system + console (ENV=dev|secure)"
    cmds:
      - go run ./errors/cmd/gen_langs/ {{.ERRORS_DIR}} {{if eq .ENV "secure"}}--prod{{end}}
      - go run ./messages/cmd/gen_langs/ {{.MESSAGES_DIR}}
      - |
        echo "==> ensure docker network {{.EDGE_NETWORK}}"
        if sudo docker network inspect {{.EDGE_NETWORK}}; then
          echo "  network {{.EDGE_NETWORK}} already exists"
        else
          echo "ERROR: Docker network {{.EDGE_NETWORK}} missing. Start NFX-Edge first."
          exit 1
        fi
      - |
        ENV_ARGS=(--env-file "{{.ENV_FILE}}")
        svcs=(s3-base admin-base object-base iam-base notify-base system-base console)
        for svc in "${svcs[@]}"; do
          echo "==> docker compose build --no-cache $svc"
          sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} build --no-cache "$svc"
        done
        echo "==> docker compose up"
        sudo docker compose "${ENV_ARGS[@]}" -f {{.APP_COMPOSE}} up {{if eq .ENV "secure"}}-d{{end}}

  run:down:
    desc: "Stop the app stack (ENV=dev|secure)"
    cmds:
      - sudo docker compose --env-file {{.ENV_FILE}} -f {{.APP_COMPOSE}} down

  atlas:gen-models:
    desc: "Generate Go models from the PostgreSQL schema (ENV=dev|secure)"
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - |
        export POSTGRES_USER="${POSTGRES_USER:-$POSTGRESQL_USER}"
        export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$POSTGRESQL_PASSWORD}"
        export POSTGRES_HOST="${ATLAS_POSTGRES_HOST:-${POSTGRESQL_DATABASE_HOST:-192.168.1.64}}"
        export POSTGRES_PORT="${ATLAS_POSTGRES_PORT:-${POSTGRESQL_DATABASE_PORT:-10104}}"
        if [[ "{{.ENV}}" == "secure" ]]; then
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_PROD}}"
        else
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_DEV}}"
        fi
        export POSTGRES_DB_SHADOW="${POSTGRES_DB_SHADOW:-${POSTGRESQL_NAME_SHADOW:-nfxstorages_diff}}"
        export POSTGRES_SSLMODE="${POSTGRES_SSLMODE:-disable}"
        export POSTGRES_CONTAINER_NAME="${POSTGRES_CONTAINER_NAME:-NFX-Stack-PostgreSQL}"
        export ATLAS_POSTGRES_USE_DOCKER="${ATLAS_POSTGRES_USE_DOCKER:-true}"
        export ATLAS_ENV="${ATLAS_ENV:-{{.ENV}}}"
        bash databases/scripts/gen_models.sh
    silent: false

  atlas:gen-views:
    desc: "Generate Go views from the PostgreSQL schema (ENV=dev|secure)"
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - |
        export POSTGRES_USER="${POSTGRES_USER:-$POSTGRESQL_USER}"
        export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$POSTGRESQL_PASSWORD}"
        export POSTGRES_HOST="${ATLAS_POSTGRES_HOST:-${POSTGRESQL_DATABASE_HOST:-192.168.1.64}}"
        export POSTGRES_PORT="${ATLAS_POSTGRES_PORT:-${POSTGRESQL_DATABASE_PORT:-10104}}"
        if [[ "{{.ENV}}" == "secure" ]]; then
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_PROD}}"
        else
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_DEV}}"
        fi
        export POSTGRES_DB_SHADOW="${POSTGRES_DB_SHADOW:-${POSTGRESQL_NAME_SHADOW:-nfxstorages_diff}}"
        export POSTGRES_SSLMODE="${POSTGRES_SSLMODE:-disable}"
        export POSTGRES_CONTAINER_NAME="${POSTGRES_CONTAINER_NAME:-NFX-Stack-PostgreSQL}"
        export ATLAS_POSTGRES_USE_DOCKER="${ATLAS_POSTGRES_USE_DOCKER:-true}"
        export ATLAS_ENV="${ATLAS_ENV:-{{.ENV}}}"
        bash databases/scripts/gen_views.sh
    silent: false

  atlas:gen-enums:
    desc: "Generate Go enums from the PostgreSQL schema (ENV=dev|secure)"
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - |
        export POSTGRES_USER="${POSTGRES_USER:-$POSTGRESQL_USER}"
        export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$POSTGRESQL_PASSWORD}"
        export POSTGRES_HOST="${ATLAS_POSTGRES_HOST:-${POSTGRESQL_DATABASE_HOST:-192.168.1.64}}"
        export POSTGRES_PORT="${ATLAS_POSTGRES_PORT:-${POSTGRESQL_DATABASE_PORT:-10104}}"
        if [[ "{{.ENV}}" == "secure" ]]; then
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_PROD}}"
        else
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_DEV}}"
        fi
        export POSTGRES_DB_SHADOW="${POSTGRES_DB_SHADOW:-${POSTGRESQL_NAME_SHADOW:-nfxstorages_diff}}"
        export POSTGRES_SSLMODE="${POSTGRES_SSLMODE:-disable}"
        export POSTGRES_CONTAINER_NAME="${POSTGRES_CONTAINER_NAME:-NFX-Stack-PostgreSQL}"
        export ATLAS_POSTGRES_USE_DOCKER="${ATLAS_POSTGRES_USE_DOCKER:-true}"
        export ATLAS_ENV="${ATLAS_ENV:-{{.ENV}}}"
        bash databases/scripts/gen_enums.sh
    silent: false

  atlas:gen:
    desc: "Generate Go models, enums and views from the database schema"
    cmds:
      - task: atlas:gen-enums
      - task: atlas:gen-models
      - task: atlas:gen-views
    silent: false

  atlas:pipeline:run:
    desc: "Run Atlas pipeline (ENV=dev|secure; extra flags after --, e.g. task atlas:pipeline:run ENV=secure -- --no-skip)"
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - |
        export POSTGRES_USER="${POSTGRES_USER:-$POSTGRESQL_USER}"
        export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-$POSTGRESQL_PASSWORD}"
        export POSTGRES_HOST="${ATLAS_POSTGRES_HOST:-${POSTGRESQL_DATABASE_HOST:-192.168.1.64}}"
        export POSTGRES_PORT="${ATLAS_POSTGRES_PORT:-${POSTGRESQL_DATABASE_PORT:-10104}}"
        if [[ "{{.ENV}}" == "secure" ]]; then
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_PROD}}"
        else
          export POSTGRES_DB="${POSTGRES_DB:-${POSTGRESQL_NAME:-$POSTGRESQL_NAME_DEV}}"
        fi
        export POSTGRES_DB_SHADOW="${POSTGRES_DB_SHADOW:-${POSTGRESQL_NAME_SHADOW:-nfxstorages_diff}}"
        export POSTGRES_SSLMODE="${POSTGRES_SSLMODE:-disable}"
        export POSTGRES_CONTAINER_NAME="${POSTGRES_CONTAINER_NAME:-NFX-Stack-PostgreSQL}"
        export ATLAS_POSTGRES_USE_DOCKER="${ATLAS_POSTGRES_USE_DOCKER:-true}"
        export ATLAS_CONFIG_PATH="file://databases/atlas.hcl"
        bash run_atlas_pipeline.sh --{{.ENV}} {{.CLI_ARGS}}

  scripts:test-db:
    desc: "Probe PostgreSQL (+ Redis) using s3 TOML + .env"
    dotenv:
      - "{{.ENV_FILE}}"
    cmds:
      - ENV={{.ENV}} go run ./scripts/testdb/ {{.CLI_ARGS}}

  scripts:clear-data:
    desc: "Truncate all table data in storages/system (dev only). Pass -- --yes to skip prompt."
    cmds:
      - go run ./scripts/cleardata/ {{.CLI_ARGS}}

  console:
    desc: "Run console dev server"
    dir: console
    cmds:
      - npm run dev

  console:i:
    desc: "Install console dependencies"
    dir: console
    cmds:
      - npm install
