syntax = "proto3";
package forger_profile;

option go_package = "nfxstorages/protos/gen/auth/forger_profile;forgerprofilepb";

import "auth/account.proto";

message ConfirmForgerProfileAvatarRequest {
  string account_id = 1;
  string image_id = 2;
  string profile_id = 3;
}

message ConfirmForgerProfileAvatarResponse {
  account.ForgerProfileAvatar avatar = 1;
}

message ConfirmForgerProfileBackgroundItem {
  string image_id = 1;
  int32 sort_order = 2;
}

message ConfirmForgerProfileBackgroundsRequest {
  string account_id = 1;
  repeated ConfirmForgerProfileBackgroundItem images = 2;
  string profile_id = 3;
}

message ConfirmForgerProfileBackgroundsResponse {
  repeated account.ForgerProfileBackground backgrounds = 1;
}

message PublicProfileCard {
  string profile_id = 1;
  optional string display_name = 2;
  optional string avatar_image_id = 3;
  optional string city = 4;
  optional string country = 5;
  optional string website = 6;
  optional string timezone = 7;
  optional string birthday = 8;
  optional string background_image_id = 9;
}

message BatchGetPublicProfileCardsRequest {
  repeated string profile_ids = 1;
}

message BatchGetPublicProfileCardsResponse {
  repeated PublicProfileCard profiles = 1;
}

message GetForgerRolesRequest {
  string profile_id = 1;
}

message GetForgerRolesResponse {
  repeated account.ForgerRole forger_roles = 1;
}

message HasForgerRoleRequest {
  string account_id = 1;
  string profile_id = 2;
  string profile_scope = 3;
}

message HasForgerRoleResponse {
  bool allowed = 1;
}

service ForgerProfileService {
  rpc ConfirmForgerProfileAvatar (ConfirmForgerProfileAvatarRequest) returns (ConfirmForgerProfileAvatarResponse);
  rpc ConfirmForgerProfileBackgrounds (ConfirmForgerProfileBackgroundsRequest) returns (ConfirmForgerProfileBackgroundsResponse);
  rpc BatchGetPublicProfileCards (BatchGetPublicProfileCardsRequest) returns (BatchGetPublicProfileCardsResponse);
  rpc GetForgerRoles (GetForgerRolesRequest) returns (GetForgerRolesResponse);
  rpc HasForgerRole (HasForgerRoleRequest) returns (HasForgerRoleResponse);
  rpc IsForger (HasForgerRoleRequest) returns (HasForgerRoleResponse);
}
