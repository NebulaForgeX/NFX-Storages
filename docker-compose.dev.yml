      traefik.project: "nfx-storages"
      traefik.http.services.storages-system-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-system-base.entrypoints: web
      traefik.http.middlewares.nfx-storages-system-gw.stripprefix.prefixes: ${API_GATEWAY_PREFIX}
      traefik.http.routers.storages-system-base.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_SYSTEM}`)
