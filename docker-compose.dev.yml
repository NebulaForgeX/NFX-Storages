    container_name: NFX-Storages-System-Base-Dev
    build:
      context: .
      dockerfile: inputs/system/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    command: [ "air", "-c", "inputs/system/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SYSTEM}"
    ports:
      - "${GRPC_EXT_PORT_SYSTEM}:${GRPC_PORT_SYSTEM}"
    labels:
