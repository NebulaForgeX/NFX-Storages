name: nfx-storages-dev
# Publish HTTP, gRPC, and console on ${NAS_IP}:host port.
# NFX-Edge routes to those ports. This file has no Traefik labels and no shared network.

services:

  s3-base:
    image: nfx-storages-s3-base:dev
    container_name: NFX-Storages-S3-Base-Dev
    build:
      context: .
      dockerfile: inputs/s3/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    command: [ "air", "-c", "inputs/s3/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_S3}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_S3}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_S3}:${GRPC_PORT_S3}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}

  admin-base:
    image: nfx-storages-admin-base:dev
    container_name: NFX-Storages-Admin-Base-Dev
    build:
      context: .
      dockerfile: inputs/admin/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    command: [ "air", "-c", "inputs/admin/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_ADMIN}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_ADMIN}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_ADMIN}:${GRPC_PORT_ADMIN}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}

  object-base:
    image: nfx-storages-object-base:dev
    container_name: NFX-Storages-Object-Base-Dev
    build:
      context: .
      dockerfile: inputs/object/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    command: [ "air", "-c", "inputs/object/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_OBJECT}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_OBJECT}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_OBJECT}:${GRPC_PORT_OBJECT}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}

  iam-base:
    image: nfx-storages-iam-base:dev
    container_name: NFX-Storages-Iam-Base-Dev
    build:
      context: .
      dockerfile: inputs/iam/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    command: [ "air", "-c", "inputs/iam/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_IAM}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_IAM}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_IAM}:${GRPC_PORT_IAM}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}

  notify-base:
    image: nfx-storages-notify-base:dev
    container_name: NFX-Storages-Notify-Base-Dev
    build:
      context: .
      dockerfile: inputs/notify/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    command: [ "air", "-c", "inputs/notify/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_NOTIFY}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_NOTIFY}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_NOTIFY}:${GRPC_PORT_NOTIFY}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}

  console:
    image: node:22-bookworm-slim
    container_name: NFX-Storages-Console-Dev
    working_dir: /app
    volumes:
      - ./console:/app
    command: ["node", "node_modules/vite/bin/vite.js", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
      VITE_SERVER_HOST: ${VITE_SERVER_HOST}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_S3_ENDPOINT: ${VITE_S3_ENDPOINT}
      VITE_PORT: ${VITE_PORT}
      VITE_BASE: ${VITE_BASE}
      DOCKER: "1"
    expose:
      - "${VITE_PORT}"
    ports:
      - "${NAS_IP}:${CONSOLE_EXTERNAL_PORT}:${VITE_PORT}"
    init: true
