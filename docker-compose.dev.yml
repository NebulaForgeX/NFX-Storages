      traefik.http.routers.storages-object-base.entrypoints: web
      traefik.http.middlewares.nfx-storages-object-gw.stripprefix.prefixes: ${API_GATEWAY_PREFIX}
      traefik.http.routers.storages-object-base.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_OBJECT}`)
      traefik.http.routers.storages-object-base.priority: "20"
      traefik.http.routers.storages-object-base.middlewares: nfx-storages-object-gw
      traefik.http.routers.storages-object-base.service: storages-object-base
      traefik.http.routers.storages-object-base-secure.entrypoints: websecure
      traefik.http.routers.storages-object-base-secure.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_OBJECT}`)
      traefik.http.routers.storages-object-base-secure.priority: "20"
      traefik.http.routers.storages-object-base-secure.middlewares: nfx-storages-object-gw
      traefik.http.routers.storages-object-base-secure.service: storages-object-base
      traefik.http.routers.storages-object-base-secure.tls: "true"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
