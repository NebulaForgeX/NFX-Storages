      traefik.http.routers.storages-notify-base.priority: "20"
      traefik.http.routers.storages-notify-base.middlewares: nfx-storages-notify-gw
      traefik.http.routers.storages-notify-base.service: storages-notify-base
      traefik.http.routers.storages-notify-base-secure.entrypoints: websecure
      traefik.http.routers.storages-notify-base-secure.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_NOTIFY}`)
      traefik.http.routers.storages-notify-base-secure.priority: "20"
