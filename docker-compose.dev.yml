      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
      - nfx-edge
      - nfx-stack

  console:
    image: nfx-storages-console:dev
    container_name: NFX-Storages-Console-Dev
    build:
      context: ./console
      dockerfile: Dockerfile
      target: dev
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
        VITE_SERVER_HOST: ${VITE_SERVER_HOST}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_S3_ENDPOINT: ${VITE_S3_ENDPOINT}
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
      VITE_SERVER_HOST: ${VITE_SERVER_HOST}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_S3_ENDPOINT: ${VITE_S3_ENDPOINT}
      VITE_PORT: ${VITE_PORT}
      DOCKER: "1"
    ports:
      - "${CONSOLE_EXTERNAL_PORT}:${VITE_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-console.loadbalancer.server.port: "${VITE_PORT}"
      traefik.http.routers.storages-console.entrypoints: web
      traefik.http.routers.storages-console.rule: Host(`${TRAEFIK_CONSOLE_HOST}`)
      traefik.http.routers.storages-console.service: storages-console
      traefik.http.routers.storages-console.priority: "1"
      traefik.http.routers.storages-console-secure.entrypoints: websecure
      traefik.http.routers.storages-console-secure.rule: Host(`${TRAEFIK_CONSOLE_HOST}`)
      traefik.http.routers.storages-console-secure.service: storages-console
      traefik.http.routers.storages-console-secure.tls: "true"
      traefik.http.routers.storages-console-secure.priority: "1"
    develop:
      watch:
        - action: sync
          path: ./console
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./console/package.json
        - action: rebuild
          path: ./console/package-lock.json
        - action: rebuild
          path: ./console/Dockerfile
    networks:
      - nfx-storages
      - nfx-edge

networks:
  nfx-storages:
    name: nfx-storages
    driver: bridge
  nfx-edge:
    external: true
    name: nfx-edge
  nfx-stack:
    external: true
    name: nfx-stack
