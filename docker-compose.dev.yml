      traefik.http.routers.storages-iam-base.entrypoints: web
      traefik.http.middlewares.nfx-storages-iam-gw.stripprefix.prefixes: ${API_GATEWAY_PREFIX}
      traefik.http.routers.storages-iam-base.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_IAM}`)
      traefik.http.routers.storages-iam-base.priority: "20"
      traefik.http.routers.storages-iam-base.middlewares: nfx-storages-iam-gw
      traefik.http.routers.storages-iam-base.service: storages-iam-base
      traefik.http.routers.storages-iam-base-secure.entrypoints: websecure
      traefik.http.routers.storages-iam-base-secure.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_IAM}`)
      traefik.http.routers.storages-iam-base-secure.priority: "20"
      traefik.http.routers.storages-iam-base-secure.middlewares: nfx-storages-iam-gw
      traefik.http.routers.storages-iam-base-secure.service: storages-iam-base
      traefik.http.routers.storages-iam-base-secure.tls: "true"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
