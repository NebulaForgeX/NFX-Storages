      traefik.http.routers.storages-system-base-secure.entrypoints: websecure
      traefik.http.routers.storages-system-base-secure.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.routers.storages-system-base-secure.priority: "20"
      traefik.http.routers.storages-system-base-secure.middlewares: nfx-storages-system-gw
      traefik.http.routers.storages-system-base-secure.service: storages-system-base
