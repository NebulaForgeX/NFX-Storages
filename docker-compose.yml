      traefik.project: "nfx-storages"
      traefik.http.services.storages-notify-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-notify-base.entrypoints: web
      traefik.http.routers.storages-notify-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_NOTIFY}`)
      traefik.http.routers.storages-notify-base.service: storages-notify-base
      traefik.http.routers.storages-notify-base-secure.entrypoints: websecure
      traefik.http.routers.storages-notify-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_NOTIFY}`)
      traefik.http.routers.storages-notify-base-secure.service: storages-notify-base
      traefik.http.routers.storages-notify-base-secure.tls: "true"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
