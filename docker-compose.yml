    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-object-api.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-object-api.entrypoints: web
      traefik.http.routers.storages-object-api.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_OBJECT}`)
      traefik.http.routers.storages-object-api.service: storages-object-api
      traefik.http.routers.storages-object-api-secure.entrypoints: websecure
      traefik.http.routers.storages-object-api-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_OBJECT}`)
      traefik.http.routers.storages-object-api-secure.service: storages-object-api
      traefik.http.routers.storages-object-api-secure.tls: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
      - nfx-edge
    restart: unless-stopped

  object-connection:
    image: nfx-storages-object-connection:prod
    container_name: NFX-Storages-Object-Connection
    build:
      context: .
      dockerfile: inputs/object/connection/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_OBJECT}"
    ports:
      - "${GRPC_PORT_OBJECT}:${GRPC_PORT_OBJECT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
    restart: unless-stopped


  iam-api:
    image: nfx-storages-iam-api:prod
    container_name: NFX-Storages-Iam-Api
    build:
      context: .
      dockerfile: inputs/iam/api/Dockerfile
      target: prod
    environment:
