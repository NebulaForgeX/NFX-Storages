name: nfx-storages

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。traefik.project 由 Edge LabelRegex 发现。
# Must start NFX-Edge first (creates nfx-edge). This stack has no reverse-proxy.

services:
  s3-api:
    image: nfx-storages-s3-api:prod
    container_name: NFX-Storages-S3-Api
    build:
      context: .
      dockerfile: inputs/s3/api/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-s3-api.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-s3-api.entrypoints: web
      traefik.http.routers.storages-s3-api.rule: Host(`${TRAEFIK_S3_HOST}`)
      traefik.http.routers.storages-s3-api.service: storages-s3-api
      traefik.http.routers.storages-s3-api-secure.entrypoints: websecure
      traefik.http.routers.storages-s3-api-secure.rule: Host(`${TRAEFIK_S3_HOST}`)
      traefik.http.routers.storages-s3-api-secure.service: storages-s3-api
      traefik.http.routers.storages-s3-api-secure.tls: "true"
    volumes:
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
      - nfx-edge
    restart: unless-stopped

  s3-connection:
    image: nfx-storages-s3-connection:prod
    container_name: NFX-Storages-S3-Connection
    build:
      context: .
      dockerfile: inputs/s3/connection/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_S3}"
    ports:
      - "${GRPC_PORT_S3}:${GRPC_PORT_S3}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
    restart: unless-stopped


  admin-api:
    image: nfx-storages-admin-api:prod
    container_name: NFX-Storages-Admin-Api
    build:
      context: .
      dockerfile: inputs/admin/api/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-admin-api.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-admin-api.entrypoints: web
      traefik.http.routers.storages-admin-api.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ADMIN}`)
      traefik.http.routers.storages-admin-api.service: storages-admin-api
      traefik.http.routers.storages-admin-api-secure.entrypoints: websecure
      traefik.http.routers.storages-admin-api-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ADMIN}`)
      traefik.http.routers.storages-admin-api-secure.service: storages-admin-api
      traefik.http.routers.storages-admin-api-secure.tls: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
      - nfx-edge
    restart: unless-stopped

  admin-connection:
    image: nfx-storages-admin-connection:prod
    container_name: NFX-Storages-Admin-Connection
    build:
      context: .
      dockerfile: inputs/admin/connection/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_ADMIN}"
    ports:
      - "${GRPC_PORT_ADMIN}:${GRPC_PORT_ADMIN}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
