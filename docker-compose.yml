      - nfx-edge

  system-base:
    image: nfx-storages-system-base:prod
    container_name: NFX-Storages-System-Base-Prod
    build:
      context: .
      dockerfile: inputs/system/configuration/Dockerfile.Base
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SYSTEM}"
    ports:
