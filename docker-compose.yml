  console:
    image: nfx-storages-console:prod
    container_name: NFX-Storages-Console
    build:
      context: ./console
      dockerfile: Dockerfile
      additional_contexts:
        nfx-ui: ../NFX-UI
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL:-http://127.0.0.1:10166}
        VITE_SERVER_HOST: ${VITE_SERVER_HOST:-http://127.0.0.1:10130}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:10130/nfxstorages/admin/v3}
        VITE_S3_ENDPOINT: ${VITE_S3_ENDPOINT:-http://127.0.0.1:10130}
    ports:
      - "${CONSOLE_EXTERNAL_PORT}:${CONSOLE_PORT}"
    networks:
      - nfx-storages
