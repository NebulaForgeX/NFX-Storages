    container_name: NFX-Storages-Notify-Connection
    build:
      context: .
      dockerfile: inputs/notify/connection/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_NOTIFY}"
    ports:
      - "${GRPC_PORT_NOTIFY}:${GRPC_PORT_NOTIFY}"
    extra_hosts:
