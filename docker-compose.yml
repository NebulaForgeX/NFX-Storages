    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-system-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-system-base.entrypoints: web
      traefik.http.routers.storages-system-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.routers.storages-system-base.service: storages-system-base
      traefik.http.routers.storages-system-base-secure.entrypoints: websecure
      traefik.http.routers.storages-system-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)
