      traefik.http.routers.storages-object-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_OBJECT}`)
      traefik.http.routers.storages-object-base.service: storages-object-base
      traefik.http.routers.storages-object-base-secure.entrypoints: websecure
      traefik.http.routers.storages-object-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_OBJECT}`)
      traefik.http.routers.storages-object-base-secure.service: storages-object-base
      traefik.http.routers.storages-object-base-secure.tls: "true"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
      - nfx-edge

  iam-base:
    image: nfx-storages-iam-base:prod
    container_name: NFX-Storages-Iam-Base-Prod
    build:
      context: .
      dockerfile: inputs/iam/configuration/Dockerfile.Base
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_IAM}"
    ports:
      - "${GRPC_EXT_PORT_IAM}:${GRPC_PORT_IAM}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-iam-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-iam-base.entrypoints: web
