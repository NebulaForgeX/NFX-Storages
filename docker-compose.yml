  system-api:
    image: nfx-storages-system-api:prod
    container_name: NFX-Storages-System-Api
    build:
      context: .
      dockerfile: inputs/system/api/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-system-api.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-system-api.entrypoints: web
      traefik.http.routers.storages-system-api.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.routers.storages-system-api.service: storages-system-api
      traefik.http.routers.storages-system-api-secure.entrypoints: websecure
      traefik.http.routers.storages-system-api-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.routers.storages-system-api-secure.service: storages-system-api
      traefik.http.routers.storages-system-api-secure.tls: "true"
    extra_hosts:
