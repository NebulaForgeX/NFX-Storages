      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-iam-api.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-iam-api.entrypoints: web
      traefik.http.routers.storages-iam-api.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_IAM}`)
      traefik.http.routers.storages-iam-api.service: storages-iam-api
      traefik.http.routers.storages-iam-api-secure.entrypoints: websecure
      traefik.http.routers.storages-iam-api-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_IAM}`)
      traefik.http.routers.storages-iam-api-secure.service: storages-iam-api
      traefik.http.routers.storages-iam-api-secure.tls: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
      - nfx-edge
    restart: unless-stopped

  iam-connection:
    image: nfx-storages-iam-connection:prod
    container_name: NFX-Storages-Iam-Connection
    build:
      context: .
      dockerfile: inputs/iam/connection/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_IAM}"
    ports:
      - "${GRPC_PORT_IAM}:${GRPC_PORT_IAM}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
    restart: unless-stopped


  notify-api:
    image: nfx-storages-notify-api:prod
    container_name: NFX-Storages-Notify-Api
    build:
      context: .
      dockerfile: inputs/notify/api/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-notify-api.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-notify-api.entrypoints: web
      traefik.http.routers.storages-notify-api.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_NOTIFY}`)
      traefik.http.routers.storages-notify-api.service: storages-notify-api
      traefik.http.routers.storages-notify-api-secure.entrypoints: websecure
      traefik.http.routers.storages-notify-api-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_NOTIFY}`)
      traefik.http.routers.storages-notify-api-secure.service: storages-notify-api
      traefik.http.routers.storages-notify-api-secure.tls: "true"
