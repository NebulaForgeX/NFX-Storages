name: nfx-storages
# Publish HTTP, gRPC, and console on ${NAS_IP}:host port.
# NFX-Edge routes to those ports. This file has no Traefik labels and no shared network.

services:

  s3-base:
    image: nfx-storages-s3-base:prod
    container_name: NFX-Storages-S3-Base-Prod
    build:
      context: .
      dockerfile: inputs/s3/configuration/Dockerfile.Base
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_S3}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_S3}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_S3}:${GRPC_PORT_S3}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    restart: always

  admin-base:
    image: nfx-storages-admin-base:prod
    container_name: NFX-Storages-Admin-Base-Prod
    build:
      context: .
      dockerfile: inputs/admin/configuration/Dockerfile.Base
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_ADMIN}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_ADMIN}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_ADMIN}:${GRPC_PORT_ADMIN}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    restart: always

  object-base:
    image: nfx-storages-object-base:prod
    container_name: NFX-Storages-Object-Base-Prod
    build:
      context: .
      dockerfile: inputs/object/configuration/Dockerfile.Base
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_OBJECT}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_OBJECT}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_OBJECT}:${GRPC_PORT_OBJECT}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    restart: always

  iam-base:
    image: nfx-storages-iam-base:prod
    container_name: NFX-Storages-Iam-Base-Prod
    build:
      context: .
      dockerfile: inputs/iam/configuration/Dockerfile.Base
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_IAM}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_IAM}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_IAM}:${GRPC_PORT_IAM}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    restart: always

  notify-base:
    image: nfx-storages-notify-base:prod
    container_name: NFX-Storages-Notify-Base-Prod
    build:
      context: .
      dockerfile: inputs/notify/configuration/Dockerfile.Base
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_NOTIFY}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_NOTIFY}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_NOTIFY}:${GRPC_PORT_NOTIFY}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    restart: always

  console:
    image: nfx-storages-console:prod
    container_name: NFX-Storages-Console-Prod
    build:
      context: ./console
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
        VITE_SERVER_HOST: ${VITE_SERVER_HOST}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_S3_ENDPOINT: ${VITE_S3_ENDPOINT}
        VITE_BASE: ${VITE_BASE}
    environment:
      NAS_IP: ${NAS_IP}
      NGINX_ENVSUBST_FILTER: NAS_IP
    ports:
      - "${NAS_IP}:${CONSOLE_EXTERNAL_PORT}:${CONSOLE_PORT}"
    restart: always
