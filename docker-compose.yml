  system-connection:
    image: nfx-storages-system-connection:prod
    container_name: NFX-Storages-System-Connection
    build:
      context: .
      dockerfile: inputs/system/connection/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SYSTEM}"
    ports:
      - "${GRPC_PORT_SYSTEM}:${GRPC_PORT_SYSTEM}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
    restart: unless-stopped


  console:
    image: nfx-storages-console:prod
    container_name: NFX-Storages-Console
    build:
      context: ./console
      dockerfile: Dockerfile
      additional_contexts:
        nfx-ui: ../NFX-UI
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
        VITE_SERVER_HOST: ${VITE_SERVER_HOST}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_S3_ENDPOINT: ${VITE_S3_ENDPOINT}
    ports:
      - "${CONSOLE_EXTERNAL_PORT}:${CONSOLE_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-console.loadbalancer.server.port: "${CONSOLE_PORT}"
      traefik.http.routers.storages-console.entrypoints: web
      traefik.http.routers.storages-console.rule: Host(`${TRAEFIK_CONSOLE_HOST}`)
      traefik.http.routers.storages-console.service: storages-console
      traefik.http.routers.storages-console.priority: "1"
      traefik.http.routers.storages-console-secure.entrypoints: websecure
      traefik.http.routers.storages-console-secure.rule: Host(`${TRAEFIK_CONSOLE_HOST}`)
      traefik.http.routers.storages-console-secure.service: storages-console
      traefik.http.routers.storages-console-secure.tls: "true"
      traefik.http.routers.storages-console-secure.priority: "1"
    networks:
      - nfx-storages
      - nfx-edge
    restart: unless-stopped

networks:
  nfx-storages:
    name: nfx-storages
    driver: bridge
  nfx-edge:
    external: true
    name: nfx-edge
