name: nfx-storages

services:
  reverse-proxy:
    image: traefik:latest
    container_name: NFX-Storages-Reverse-Proxy
    command:
      - --api.insecure=true
      - --providers.docker
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.project`, `nfx-storages`)
      - --entrypoints.web.address=:${TRAEFIK_HTTP_INTERNAL_PORT}
      - --entrypoints.websecure.address=:${TRAEFIK_HTTPS_INTERNAL_PORT}
      - --entrypoints.traefik.address=:${TRAEFIK_DASHBOARD_INTERNAL_PORT}
    ports:
      - "${TRAEFIK_HTTP_PORT}:${TRAEFIK_HTTP_INTERNAL_PORT}"
      - "${TRAEFIK_HTTPS_PORT}:${TRAEFIK_HTTPS_INTERNAL_PORT}"
      - "${TRAEFIK_DASHBOARD_PORT}:${TRAEFIK_DASHBOARD_INTERNAL_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${TRAEFIK_DYNAMIC_DIR}:/etc/traefik/dynamic:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
    restart: unless-stopped


  s3-api:
    image: nfx-storages-s3-api:prod
    container_name: NFX-Storages-S3-Api
    build:
      context: .
      dockerfile: inputs/s3/api/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.routers.s3-api.entrypoints: web
      traefik.http.routers.s3-api.rule: PathPrefix(`/`)
      traefik.http.routers.s3-api.priority: "10"
      traefik.http.services.s3-api.loadbalancer.server.port: "${HTTP_PORT}"
    volumes:
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
    restart: unless-stopped
    depends_on:
      reverse-proxy:
        condition: service_started

  s3-connection:
    image: nfx-storages-s3-connection:prod
    container_name: NFX-Storages-S3-Connection
    build:
      context: .
      dockerfile: inputs/s3/connection/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_S3}"
    ports:
      - "${GRPC_PORT_S3}:${GRPC_PORT_S3}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
    restart: unless-stopped


  admin-api:
    image: nfx-storages-admin-api:prod
    container_name: NFX-Storages-Admin-Api
    build:
      context: .
      dockerfile: inputs/admin/api/Dockerfile
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.routers.admin-api.entrypoints: web
      traefik.http.routers.admin-api.rule: PathPrefix(`/nfxstorages/admin/v3`)
      traefik.http.routers.admin-api.priority: "20"
      traefik.http.services.admin-api.loadbalancer.server.port: "${HTTP_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
    restart: unless-stopped
    depends_on:
      reverse-proxy:
        condition: service_started

  admin-connection:
    image: nfx-storages-admin-connection:prod
    container_name: NFX-Storages-Admin-Connection
    build:
