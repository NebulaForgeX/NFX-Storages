name: nfx-storages

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。对齐 CityPulso PulsoLoop-API docker-compose.dev.yml。
# Must start NFX-Edge first (creates nfx-edge).

services:
  s3-base:
    image: nfx-storages-s3-base:prod
    container_name: NFX-Storages-S3-Base-Prod
    build:
      context: .
      dockerfile: inputs/s3/configuration/Dockerfile.Base
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_S3}"
    ports:
      - "${GRPC_EXT_PORT_S3}:${GRPC_PORT_S3}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-s3-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-s3-base.entrypoints: web
      traefik.http.routers.storages-s3-base.rule: Host(`${TRAEFIK_S3_HOST}`)
      traefik.http.routers.storages-s3-base.service: storages-s3-base
      traefik.http.routers.storages-s3-base-secure.entrypoints: websecure
      traefik.http.routers.storages-s3-base-secure.rule: Host(`${TRAEFIK_S3_HOST}`)
      traefik.http.routers.storages-s3-base-secure.service: storages-s3-base
      traefik.http.routers.storages-s3-base-secure.tls: "true"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
      - nfx-edge

  admin-base:
    image: nfx-storages-admin-base:prod
    container_name: NFX-Storages-Admin-Base-Prod
    build:
      context: .
      dockerfile: inputs/admin/configuration/Dockerfile.Base
      target: prod
    environment:
      - ENV=prod
      - STORAGES_VOLUMES=${STORAGES_VOLUME_0},${STORAGES_VOLUME_1},${STORAGES_VOLUME_2},${STORAGES_VOLUME_3}
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_ADMIN}"
    ports:
      - "${GRPC_EXT_PORT_ADMIN}:${GRPC_PORT_ADMIN}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-storages"
      traefik.http.services.storages-admin-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.storages-admin-base.entrypoints: web
      traefik.http.routers.storages-admin-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ADMIN}`)
      traefik.http.routers.storages-admin-base.service: storages-admin-base
      traefik.http.routers.storages-admin-base-secure.entrypoints: websecure
      traefik.http.routers.storages-admin-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ADMIN}`)
      traefik.http.routers.storages-admin-base-secure.service: storages-admin-base
      traefik.http.routers.storages-admin-base-secure.tls: "true"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ${STORAGES_VOLUME_0}:${STORAGES_VOLUME_0}
      - ${STORAGES_VOLUME_1}:${STORAGES_VOLUME_1}
      - ${STORAGES_VOLUME_2}:${STORAGES_VOLUME_2}
      - ${STORAGES_VOLUME_3}:${STORAGES_VOLUME_3}
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-storages
      - nfx-edge

  object-base:
